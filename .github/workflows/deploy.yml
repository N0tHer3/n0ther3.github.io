name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # 确保站点来源是「GitHub Actions」而不是「Deploy from a branch」，
  # 否则源码会被当作站点直接发布（表现为页面黑屏）
  ensure-pages-source:
    runs-on: ubuntu-latest
    steps:
      - name: Force Pages build_type to workflow
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "PATCH /pages => $code"
          if [ "$code" = "204" ] || [ "$code" = "200" ]; then
            echo "Pages source is now GitHub Actions."
          elif [ "$code" = "409" ]; then
            echo "Pages not enabled yet; workflow deploy will create it."
          else
            echo "::warning::Unexpected response $code; if the site still shows source files, switch Pages source to 'GitHub Actions' manually."
          fi

  build:
    needs: ensure-pages-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 关闭 Jekyll 处理，保证下划线开头等文件原样发布
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
